<div class="container mt-2">
  <form (ngSubmit)="saveMember()">
    <div class="row">
      <div class="col-md-6">
        <h3>Member Information</h3>
        <div class="mb-2">
          <label for="memberName" class="form-label">Member Name</label>
          <input
            type="text"
            id="memberName"
            name="memberName"
            class="form-control"
            [(ngModel)]="memberObj.memberName"
          />
        </div>
        <div class="mb-2">
          <label for="categoryId" class="form-label">Category</label>
          <select
            id="categoryId"
            name="categoryId"
            class="form-select"
            [(ngModel)]="memberObj.categoryId"
          >
            <option [ngValue]="0">-- Select Category --</option>
            @for (c of categories; track c.categoryId) {
              <option [ngValue]="c.categoryId">{{ c.categoryName }}</option>
            }
          </select>
        </div>
        <div class="mb-2">
          <label for="membershipDate" class="form-label">Membership Date</label>
          <input
            type="date"
            id="membershipDate"
            name="membershipDate"
            class="form-control"
            [(ngModel)]="memberObj.membershipDate"
          />
        </div>
        <div class="mb-2">
          <label for="membershipFee" class="form-label">Membership Fee</label>
          <input
            type="number"
            id="membershipFee"
            name="membershipFee"
            class="form-control"
            [(ngModel)]="memberObj.membershipFee"
          />
        </div>
        <div class="mb-2">
          <input
            type="checkbox"
            id="isStudent"
            name="isStudent"
            class="form-check-input"
            [(ngModel)]="memberObj.isStudent"
          />&nbsp;
          <label for="isStudent" class="form-check-label">Is Student ?</label>
        </div>
        <div class="mb-2">
          <label class="form-label">Member Image</label>
          <input
            type="file"
            class="form-control mb-3"
            accept="image/jpeg,image/png"
            (change)="onSelectedFile($event)"
          />
          @if (imageUrl) {
            <img [src]="imageUrl" alt="member" class="img-thumbnail" style="max-width: 200px" />
          }
        </div>
      </div>

      <div class="col-md-6">
        <h3>Borrowed Items</h3>
        <button type="button" class="btn btn-info mb-2" (click)="addItem()">Add Item</button>
        @if (itemList && itemList.length > 0) {
          @for (item of itemList; track $index) {
            <div class="row g-2 mb-2 align-items-center">
              <div class="col-5">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Book Name"
                  [(ngModel)]="item.bookName"
                  [ngModelOptions]="{ standalone: true }"
                />
              </div>
              <div class="col-5">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Author Name"
                  [(ngModel)]="item.authorName"
                  [ngModelOptions]="{ standalone: true }"
                />
              </div>
              <div class="col-2">
                <button type="button" class="btn btn-danger" (click)="deleteItem(item)">
                  Remove
                </button>
              </div>
            </div>
          }
        } @else {
          <p class="text-muted text-center fst-italic">
            No item added. Click "Add Item" to add a book.
          </p>
        }
      </div>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-success">Save Member</button>
    </div>
  </form>
</div>
